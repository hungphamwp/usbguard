name: Kiem thu tren Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build UsbGuard.exe (.NET Framework 4.8, Release)
        shell: pwsh
        run: dotnet build UsbGuard.csproj -c Release -nologo

      - name: Unit test (xUnit)
        shell: pwsh
        run: dotnet test tests/UsbGuard.Tests.csproj -nologo --logger "trx;LogFileName=unit.trx" --logger "console;verbosity=normal" --results-directory tests/ket-qua

      - name: Kiem thu tich hop (cai dich vu that, chan, chong tat, go)
        shell: pwsh
        run: ./tests/integration.ps1 -Exe bin/Release/net48/UsbGuard.exe

      - name: Tai ket qua
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-${{ matrix.os }}
          path: |
            tests/ket-qua/
            bin/Release/net48/UsbGuard.exe

      - name: Chay thu bo cai cho nguoi dung (CAI-DAT.bat / GO-CAI-DAT.bat)
        shell: cmd
        timeout-minutes: 5
        run: |
          copy /y bin\Release\net48\UsbGuard.exe release\UsbGuard-1.0\UsbGuard.exe
          cd release\UsbGuard-1.0
          (echo MatKhauGoi@2026& echo MatKhauGoi@2026& echo.) | CAI-DAT.bat
          sc query UsbGuard | find "RUNNING" || exit /b 1
          reg query HKLM\SYSTEM\CurrentControlSet\Services\USBSTOR /v Start | find "0x4" || exit /b 1
          > menu.txt echo 1
          >> menu.txt echo.
          >> menu.txt echo 4
          >> menu.txt echo.
          >> menu.txt echo 7
          >> menu.txt echo.
          >> menu.txt echo 0
          call QUAN-LY.bat < menu.txt > menu-out.txt 2>&1
          type menu-out.txt
          find "RUNNING" menu-out.txt || exit /b 1
          find "USB" menu-out.txt | find ": 0" || exit /b 1
          find "whitelist" menu-out.txt || exit /b 1
          (echo MatKhauGoi@2026& echo.) | GO-CAI-DAT.bat
          sc query UsbGuard && exit /b 1
          reg query HKLM\SYSTEM\CurrentControlSet\Services\USBSTOR /v Start | find "0x3" || exit /b 1
          echo BO CAI CHAY DUNG
