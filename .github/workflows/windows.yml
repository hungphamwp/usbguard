name: Kiem thu tren Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build UsbGuard.exe (.NET Framework 4.8, Release)
        shell: pwsh
        run: dotnet build UsbGuard.csproj -c Release -nologo

      - name: Unit test (xUnit)
        shell: pwsh
        run: dotnet test tests/UsbGuard.Tests.csproj -nologo --logger "trx;LogFileName=unit.trx" --logger "console;verbosity=normal" --results-directory tests/ket-qua

      - name: Kiem thu tich hop (cai dich vu that, chan, chong tat, go)
        shell: pwsh
        run: ./tests/integration.ps1 -Exe bin/Release/net48/UsbGuard.exe

      - name: Tai ket qua
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ket-qua-${{ matrix.os }}
          path: |
            tests/ket-qua/
            bin/Release/net48/UsbGuard.exe

      - name: Chay thu bo cai cho nguoi dung (CAI-DAT.bat / QUAN-LY.bat / GO-CAI-DAT.bat)
        shell: pwsh
        timeout-minutes: 5
        run: |
          Copy-Item bin/Release/net48/UsbGuard.exe release/UsbGuard-1.0/UsbGuard.exe -Force
          Set-Location release/UsbGuard-1.0
          function Run-Bat($bat, [string[]]$lines) {
            $in = Join-Path $env:RUNNER_TEMP "$bat.in.txt"; $out = Join-Path $env:RUNNER_TEMP "$bat.out.txt"
            [IO.File]::WriteAllText($in, (($lines -join "`r`n") + "`r`n"))
            cmd.exe /d /c "$bat < `"$in`" > `"$out`" 2>&1"
            $t = Get-Content $out -Raw -Encoding UTF8
            Write-Host "===== $bat (ma thoat $LASTEXITCODE) ====="; Write-Host $t
            return $t
          }
          $pw = 'MatKhauGoi@2026'
          $o = Run-Bat 'CAI-DAT.bat' @($pw, $pw, '')
          if ($o -notmatch 'RUNNING') { throw 'CAI-DAT.bat: dich vu khong chay' }
          if ((Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\USBSTOR).Start -ne 4) { throw 'USBSTOR chua bi chan' }
          $o = Run-Bat 'QUAN-LY.bat' @('1', '', '4', '', '7', '', '0')
          if ($o -notmatch 'RUNNING') { throw 'QUAN-LY lua chon 1 khong in trang thai' }
          if ($o -notmatch ': 0') { throw 'QUAN-LY lua chon 4 khong liet ke USB' }
          if ($o -notmatch 'whitelist') { throw 'QUAN-LY lua chon 7 khong hien danh sach' }
          $o = Run-Bat 'GO-CAI-DAT.bat' @($pw, '')
          sc.exe query UsbGuard | Out-Null
          if ($LASTEXITCODE -ne 1060) { throw 'GO-CAI-DAT.bat: dich vu van con' }
          if ((Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\USBSTOR).Start -ne 3) { throw 'USBSTOR chua tra ve mac dinh' }
          Write-Host 'BO CAI CHAY DUNG'
